name: mk-consulta-cliente

services:
  api:
    image: mk-consulta-cliente:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${API_ENV_FILE:-.env}
        required: true
    environment:
      HTTP_PORT: "8080"
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PUBLIC_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
